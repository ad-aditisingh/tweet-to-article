<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tweet to News Article</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Tweet to News Article Generator</h1>

    <div class="form">
        <label>Author</label>
        <input type="text" id="author" placeholder="e.g. Sundar Pichai">

        <label>Date</label>
        <input type="text" id="date" placeholder="e.g. 15 January 2025">

        <label>Tweet</label>
        <textarea id="tweet" placeholder="Paste tweet here..."></textarea>

        <button onclick="generateArticle()">Generate Article</button>
    </div>

    <hr>

    <div id="output"></div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
