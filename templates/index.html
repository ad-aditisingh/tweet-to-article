<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tweet to News Article</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Tweet → News Article Generator</h1>

    <input type="text" id="author" placeholder="Author (e.g. Donald Trump)">
    <input type="text" id="date" placeholder="Date (e.g. 12 March 2025)">
    <textarea id="tweet" placeholder="Paste tweet here..."></textarea>

    <button onclick="generateArticle()">Generate Article</button>

    <h2>Generated Article</h2>
    <pre id="output"></pre>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
